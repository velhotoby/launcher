name: Publicar launcher

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Obter código
        uses: actions/checkout@v5

      - name: Configurar Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Configurar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Instalar dependências incorporadas
        run: npm ci --omit=dev

      - name: Compilar e validar versão
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          bash java-launcher-v3/build.sh
          test -f "dist/Cobblemon-Legacy-Launcher-${VERSION}.jar"
          java -jar "dist/Cobblemon-Legacy-Launcher-${VERSION}.jar" --self-test
          node java-launcher-v3/src/main/resources/backend/performance-profile.js --self-test

      - name: Criar ou atualizar Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ASSET="dist/Cobblemon-Legacy-Launcher-${VERSION}.jar"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$ASSET" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$ASSET" --title "Cobblemon Legacy Launcher ${VERSION}" --generate-notes
          fi

      - name: Preservar links do site e manter duas versões rotativas
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PROTECTED_RELEASE="v3.4.11"
          PROTECTED_ASSETS=(
            "Cobblemon-Legacy-Launcher-3.4.11.jar"
            "Cobblemon-Legacy-Launcher-Installer.exe"
          )

          mapfile -t PUBLISHED_ASSETS < <(
            gh release view "$PROTECTED_RELEASE" --repo "$GITHUB_REPOSITORY" \
              --json assets --jq '.assets[].name'
          )
          for ASSET in "${PROTECTED_ASSETS[@]}"; do
            if [[ ! " ${PUBLISHED_ASSETS[*]} " =~ " ${ASSET} " ]]; then
              echo "Arquivo permanente ausente em ${PROTECTED_RELEASE}: ${ASSET}" >&2
              exit 1
            fi
          done

          mapfile -t OLD_RELEASES < <(
            gh release list --repo "$GITHUB_REPOSITORY" --limit 100 \
              --json tagName,publishedAt \
              --jq 'map(select(.tagName != "v3.4.11")) | sort_by(.publishedAt) | reverse | .[2:] | .[].tagName'
          )
          for TAG in "${OLD_RELEASES[@]}"; do
            gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
          done
